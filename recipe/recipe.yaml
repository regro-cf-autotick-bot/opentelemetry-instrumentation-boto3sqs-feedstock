# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 0.66b2

package:
  name: opentelemetry-instrumentation-boto3sqs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-boto3sqs/opentelemetry_instrumentation_boto3sqs-${{ version }}.tar.gz
  sha256: e7b841129c7f9dc340e815cfbe85e5c938c113bd974a894c3ab1d93dc9f17dd8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }},<4.0
    - opentelemetry-api >=1.12,<2.dev0
    - opentelemetry-instrumentation ==${{ version }}
    - opentelemetry-semantic-conventions ==${{ version }}
    - wrapt >=1.0.0,<3.0.0
    - opentelemetry-instrumentation ==0.66b2
    - opentelemetry-semantic-conventions ==0.66b2
tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.instrumentation.boto3sqs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-boto3sqs
  license: Apache-2.0
  license_file: LICENSE
  summary: Boto3 SQS service tracing for OpenTelemetry
  description: |
    Boto3 SQS service tracing for OpenTelemetry
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - conda-forge/opentelemetry-api
